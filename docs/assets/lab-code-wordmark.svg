<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="Lab Code">
  <title>Lab Code</title>
  <rect width="720" height="160" fill="none"/>
  <!-- Neon wordmark  matches terminal LabAsciiLogo LAB_NEON rgb(57,255,20) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" letter-spacing="0.08em">
    <text x="360" y="78" text-anchor="middle" font-size="64" fill="#39FF14">LAB CODE</text>
    <text x="360" y="78" text-anchor="middle" font-size="64" fill="#39FF14" opacity="0.35" filter="url(#glow)">LAB CODE</text>
  </g>
  <text x="360" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#6b7280" letter-spacing="0.22em">LAB AGENT</text>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
