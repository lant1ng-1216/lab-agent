<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab Overlay</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      #svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <path id="link" d="" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.75" stroke-linecap="round" />
      <circle id="a" r="4" fill="#ffffff" fill-opacity="0.9" />
      <circle id="b" r="4" fill="#ffffff" fill-opacity="0.9" />
      <circle id="mid" r="3" fill="#ffffff" fill-opacity="0.85" />
    </svg>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
